[project]
name = "pawcare-backend"
version = "0.1.0"
description = "FastAPI backend for the PawCare demo grooming site and voice receptionist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    # 26.x ships no Intel macOS wheel and would need a local compiler toolchain.
    "argon2-cffi-bindings==25.1.0",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    # Used only by the evaluation runner in evals/.
    "websockets==17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
